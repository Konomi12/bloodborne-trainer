name: AppImage

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: packaging/build-appimage.sh "${GITHUB_REF_NAME//\//-}"

      - name: Smoke test (the window has to stay open)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15 xvfb-run -a dist/*.AppImage
          status=$?
          echo "exit status: $status"
          [ "$status" -eq 124 ]

      - uses: actions/upload-artifact@v4
        with:
          name: bb-trainer-appimage
          path: dist/*.AppImage

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.AppImage --title "$GITHUB_REF_NAME" --generate-notes
          fi
